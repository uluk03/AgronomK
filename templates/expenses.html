{% extends 'base.html' %}
{% block content %}

<h3 class="mb-3">Расходы (трактор / сенокос)</h3>

<div class="card mb-4">
  <div class="card-body">
    <form method="post" class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Категория</label>
        <select name="category" class="form-select">
          <option value="топливо">Топливо</option>
          <option value="запчасти">Запчасти</option>
          <option value="прочее">Прочее</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Сумма</label>
        <input type="number" step="0.01" name="amount" class="form-control" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Описание</label>
        <input type="text" name="description" class="form-control">
      </div>

      <div class="col-12">
        <button class="btn btn-danger">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<table class="table table-bordered table-striped">
  <thead class="table-danger">
    <tr>
      <th>Категория</th>
      <th>Сумма</th>
      <th>Описание</th>
      <th>Дата</th>
      <th>Действия</th>
    </tr>
  </thead>
  <tbody>
    {% for row in expenses %}
    <tr>
      <td>{{ row.category }}</td>
      <td>{{ row.amount }}</td>
      <td>{{ row.description }}</td>
      <td>{{ row.date }}</td>
    </tr>
    <td>
      <form method="post" action="/expense/delete/{{ row.id }}"
            onsubmit="return confirm('Удалить расход?')">
        <button class="btn btn-danger btn-sm">Удалить</button>
      </form>
    </td>
    {% else %}
    <tr>
      <td colspan="4" class="text-center">Расходов пока нет</td>
    </tr>
    {% endfor %}
  </tbody>
  
</table>

{% endblock %}
